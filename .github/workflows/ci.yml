name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Typecheck (Node 22)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payment_gateway_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/payment_gateway_test?schema=public
      DIRECT_URL: postgresql://test_user:test_password@localhost:5432/payment_gateway_test?schema=public
      SHADOW_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/postgres?schema=public
      PORT: 3001
      SUPERADMIN_KEY: ci_superadmin_test_key_minimum_32_characters_long
      TOKEN_PEPPER: ci_deterministic_token_pepper_value_32_chars
      CREDENTIAL_ENCRYPTION_KEY: ci_credential_encryption_aes256_key_32_chars!
      OWNER_SECRET: ci_owner_secret_test_value_32_chars_long!
      ADMIN_PASSWORD: ci_admin_test_password_secure_1234
      ADMIN_EMAIL: admin@testgateway.internal
      ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
      APP_URL: http://localhost:3000
      GATEWAY_BASE_URL: http://localhost:3001
      API_RATE_LIMIT_WINDOW_MS: 60000
      API_RATE_LIMIT_MAX: 1000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply Database Migrations
        run: npm run db:migrate

      - name: Verify Prisma Migration Drift
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Run Unit & Policy Tests (test:auth)
        run: npm run test:auth

      - name: Run Real Database Integration Tests (test:integration)
        run: npm run test:integration

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Server
        run: npm run server:build

      - name: Build Client
        run: npm run client:build

      - name: Run Security Audit (Production Dependencies)
        # Current advisories require major-version upgrades; keep this visible as
        # a warning until those upgrades are tested and scheduled separately.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
