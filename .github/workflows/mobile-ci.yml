name: Mobile CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'admin.html'
      - 'vite.admin.config.js'
      - 'scripts/build-admin-apk-ui.mjs'
      - 'package*.json'
      - 'tsconfig.admin.json'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'admin.html'
      - 'vite.admin.config.js'
      - 'scripts/build-admin-apk-ui.mjs'
      - 'package*.json'
      - 'tsconfig.admin.json'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-checks:
    name: Lint, Tests & Assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Validate Gradle Wrapper Checksum
        uses: gradle/actions/wrapper-validation@v4.3.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install admin UI build dependencies
        run: npm ci

      - name: Check admin UI types
        run: npm run admin:typecheck

      - name: Test admin controls
        run: npm run admin:test

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Android Lint
        working-directory: mobile
        run: ./gradlew lintDebug --no-daemon

      - name: Run Unit Tests & Screenshot Tests
        working-directory: mobile
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APKs
        working-directory: mobile
        run: ./gradlew :merchant:assembleDebug :admin:assembleDebug --no-daemon
